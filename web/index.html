<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>labstream Browser Viewer</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1.5rem; background: #111; color: #eee; }
    .row { display: flex; gap: 0.75rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
    input, select, button { padding: 0.4rem 0.65rem; border-radius: 4px; border: 1px solid #444; background: #222; color: #eee; }
    button { cursor: pointer; background: #2b6cb0; border-color: #2b6cb0; }
    canvas { width: 100%; height: 360px; background: #181818; border: 1px solid #333; display: block; }
    #log { font-family: monospace; font-size: 0.85rem; color: #9ae6b4; margin-top: 0.75rem; }
  </style>
</head>
<body>
  <h2>labstream WebSocket + WebAssembly Viewer</h2>
  <div class="row">
    <label>WS URL <input id="url" value="ws://127.0.0.1:8765/ws" size="28" /></label>
    <button id="connect">Connect</button>
    <select id="streams"></select>
    <button id="subscribe">Subscribe</button>
  </div>
  <div class="row">
    <label>Marker <input id="marker" value="stimulus_on" /></label>
    <button id="sendMarker">Send Marker</button>
    <span id="stats">0 samples</span>
  </div>
  <canvas id="plot" width="1024" height="360"></canvas>
  <pre id="log"></pre>
  <script type="module">
    import { loadLabstreamWasm, LabstreamBrowserClient } from "./labstream.js";
    const wasm = await loadLabstreamWasm("../target/wasm32-unknown-unknown/release/labstream_wasm.wasm");
    const canvas = document.getElementById("plot");
    const ctx = canvas.getContext("2d");
    const logEl = document.getElementById("log");
    const statsEl = document.getElementById("stats");
    const selectEl = document.getElementById("streams");
    let client = null;
    let total = 0;
    let ring = [];
    let channels = 1;

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!ring.length) return;
      const lane = canvas.height / channels;
      ctx.strokeStyle = "#63b3ed";
      for (let c = 0; c < channels; c++) {
        ctx.beginPath();
        for (let i = 0; i < ring.length; i++) {
          const x = (i / Math.max(1, ring.length - 1)) * canvas.width;
          const y = lane * (c + 0.5) - ring[i][c] * (lane * 0.2);
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
    }

    document.getElementById("connect").onclick = async () => {
      if (client) client.close();
      client = new LabstreamBrowserClient(document.getElementById("url").value, wasm);
      client.onMessage = (msg) => {
        if (msg.op === "streams") {
          selectEl.innerHTML = "";
          for (const s of msg.streams) {
            const opt = document.createElement("option");
            opt.value = s.name;
            opt.textContent = `${s.name} (${s.type}, ${s.channel_count} ch @ ${s.nominal_srate} Hz)`;
            selectEl.appendChild(opt);
          }
        } else if (msg.op === "subscribed") {
          channels = msg.channel_count;
          ring = [];
        }
        logEl.textContent = JSON.stringify(msg);
      };
      client.onSamples = ({ count, values, timestamps }) => {
        total += count;
        for (let i = 0; i < count; i++) {
          const row = [];
          for (let c = 0; c < channels; c++) row.push(Number(values[i * channels + c]));
          ring.push(row);
          if (ring.length > 512) ring.shift();
        }
        statsEl.textContent = `${total} samples (last ts=${timestamps[count - 1].toFixed(4)})`;
        draw();
      };
      await client.connect();
      client.listStreams();
    };

    document.getElementById("subscribe").onclick = () => {
      if (client && selectEl.value) client.subscribe(selectEl.value);
    };
    document.getElementById("sendMarker").onclick = () => {
      if (client) client.sendMarker(document.getElementById("marker").value);
    };
  </script>
</body>
</html>
