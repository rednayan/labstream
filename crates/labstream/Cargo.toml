[package]
name = "labstream"
description = "The Lab Streaming Layer, for Rust programs."
# The version moves with every other crate of the workspace. `docs/versioning.md`
# gives the rule.
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
# This crate has its own README, and it is not the one of the workspace.
readme = "README.md"

# The protocol crates of `labstream-core`. This crate holds no protocol code.
#
# The workspace gives each one a path and a version. This workspace builds
# against the path, and the published crate asks crates.io for the version.
[dependencies]
labstream-net.workspace = true
labstream-wire.workspace = true
